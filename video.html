<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Mboa – Explainer video</title>
<link rel="icon" href="brand/favicon.svg" type="image/svg+xml"><link rel="icon" href="brand/favicon-196.png" sizes="196x196" type="image/png"><link rel="apple-touch-icon" href="brand/apple-touch-icon.png"><meta name="theme-color" content="#C2532A">
<style>
  @font-face{font-family:Figtree;font-weight:400;font-display:swap;src:url(brand/fonts/Figtree_400Regular.ttf)}@font-face{font-family:Figtree;font-weight:700;font-display:swap;src:url(brand/fonts/Figtree_700Bold.ttf)}@font-face{font-family:Figtree;font-weight:800;font-display:swap;src:url(brand/fonts/Figtree_800ExtraBold.ttf)}
  body { margin: 0; background: #FBF6EF; color: #241A14; font-family: Figtree, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  .top { display: flex; align-items: center; gap: 6px; padding: 12px 16px; }
  .langs {font:inherit;font-size:14px;font-weight:700;color:#6B5B50;background:#fff;border:1px solid #E6DBCF;border-radius:999px;padding:6px 12px;min-height:36px;cursor:pointer;max-width:100%}
  main { max-width: 440px; margin: 0 auto; padding: 4px 16px 40px; }
  h1 { font-size: 24px; margin: 6px 0 14px; text-align: center; }
  #box video { width: 100%; border-radius: 18px; background: #7E3517; box-shadow: 0 6px 24px rgba(36, 26, 20, .2); display: block; aspect-ratio: 9 / 16; }
  p { line-height: 1.5; text-align: center; color: #6B5B50; }
</style>
</head>
<body>
<div class="top">
  <select class="langs" id="langSel" aria-label="Sprache / Language"><option value="en">English</option><option value="fr">Français</option><option value="de">Deutsch</option><option value="nl">Nederlands</option><option value="es">Español</option><option value="it">Italiano</option><option value="pt">Português</option></select>
</div>
<main>
  <h1 id="h"></h1>
  <div id="box"></div>
  <p id="p"></p>
</main>
<script>
  // Eine Seite für alle Sprachen: ?lang=en|fr|de|nl|es|it|pt (ES/IT/PT ohne Ton, mit Texteinblendung).
  // Beim Sprachwechsel wird das Video-Element komplett neu angelegt – sonst fehlt auf manchen Handys der Abspielknopf.
  var T = {
    en: { title: 'Mboa – Explainer video', h: 'How Mboa works', p: 'Braiders, food, churches and Afro shops near you – by and for the community.' },
    fr: { title: 'Mboa – Vidéo explicative', h: 'Comment fonctionne Mboa', p: 'Tresseuses, cuisine, églises et boutiques afro près de chez toi – par et pour la communauté.' },
    de: { title: 'Mboa – Erklärvideo', h: 'So funktioniert Mboa', p: 'Braiderinnen, Essen, Gemeinden und Afro-Shops in deiner Nähe – von und für die Community.' },
    nl: { title: 'Mboa – Uitlegvideo', h: 'Zo werkt Mboa', p: 'Vlechtsters, eten, kerken en afroshops bij jou in de buurt – door en voor de community.' },
    es: { title: 'Mboa – Vídeo explicativo', h: 'Así funciona Mboa', p: 'Trenzadoras, comida, iglesias y tiendas afro cerca de ti, por y para la comunidad. Vídeo sin sonido.' },
    it: { title: 'Mboa – Video esplicativo', h: 'Come funziona Mboa', p: 'Treccine, cibo, chiese e negozi afro vicino a te, dalla comunità per la comunità. Video senza audio.' },
    pt: { title: 'Mboa – Vídeo explicativo', h: 'Como funciona a Mboa', p: 'Trancistas, comida, igrejas e lojas afro perto de si, pela e para a comunidade. Vídeo sem som.' }
  };
  // Versionsnummer bei jeder neuen Videofassung erhöhen – sonst spielen Browser alte Dateien aus dem Zwischenspeicher
  var V = '20261127-1';
  var q = new URLSearchParams(location.search);
  var lang = q.get('lang');
  function show(l) {
    var t = T[l], box = document.getElementById('box');
    var old = box.querySelector('video');
    if (old) { old.pause(); old.removeAttribute('src'); old.load(); }
    var v = document.createElement('video');
    v.controls = true;
    v.playsInline = true;
    v.setAttribute('playsinline', '');
    v.preload = 'metadata';
    v.poster = 'poster-' + l + '.jpg?v=' + V;
    v.src = 'erklaervideo-' + l + '.mp4?v=' + V;
    box.replaceChildren(v);
    document.documentElement.lang = l;
    document.title = t.title;
    document.getElementById('h').textContent = t.h;
    document.getElementById('p').textContent = t.p;
    document.getElementById('langSel').value = l;
    history.replaceState(null, '', '?lang=' + l);
  }
  document.getElementById('langSel').onchange = function () { show(this.value); };
  var nav = (navigator.language || '').slice(0, 2).toLowerCase();
  show(T[lang] ? lang : T[nav] ? nav : 'en');
</script>
</body>
</html>
